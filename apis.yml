description: Maze Therapeutics is a clinical-stage precision medicine company developing
  small-molecule and other treatments for common diseases with significant unmet medical
  need, with a focus on kidney disease. Its Compass platform pairs human genetics with
  variant functionalization to connect specific genetic drivers to disease biology and
  design targeted medicines, including programs for APOL1-mediated kidney disease and
  SLC6A19-related conditions. Surfaced as a portfolio company of a16z and gv, it was
  added to the API Evangelist network as a lead; enrichment confirmed it publishes no
  public developer API, documentation, or discovery surface.
